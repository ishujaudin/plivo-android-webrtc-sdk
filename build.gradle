// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    project.ext {
        libraryVersion = "3.2.3-beta"
        jacocoVersion = "0.8.4"
    }

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jacoco:org.jacoco.core:$project.jacocoVersion"
    }
}


plugins {
    id 'com.android.application' version '8.6.0' apply false
    id 'com.android.library' version '8.6.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
    id("com.google.gms.google-services") version "4.4.2" apply false
    id("io.github.gradle-nexus.publish-plugin") version "1.0.0"
}

apply plugin: 'java'
apply plugin: 'checkstyle'
apply plugin: 'idea'
apply plugin: 'maven-publish'
apply plugin: 'signing'


ext {

    publishedGroupId = 'com.plivo.endpoint'
    libraryName = 'endpoint'
    artifact = 'endpoint'
    libraryDescription = 'This is the Plivo Android Webrtc Voice Call SDK that can be used to make and receive calls through Plivo.'
    siteUrl = 'https://www.plivo.com/docs/sdk/client-side-sdks/android/overview/'
    gitUrl = 'https://github.com/plivo/plivo-android-sdk2-examples'

    libraryVersion = project.libraryVersion

    PUBLISH_GROUP_ID = 'com.plivo.endpoint'
    PUBLISH_VERSION = project.libraryVersion
    PUBLISH_ARTIFACT_ID = 'endpoint'

    org = 'plivo'

    licenseName = 'The Apache Software License, Version 2.0'
    licenseUrl = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
    allLicenses = ["Apache-2.0"]
}

apply from: "${rootDir}/scripts/publish-root.gradle"

apply from: "${rootProject.projectDir}/scripts/publish-module.gradle"

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}
