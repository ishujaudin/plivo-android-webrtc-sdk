//    ndkPath ndkPathDef
    defaultConfig {
        minSdkVersion 21
        configurations.all {
            resolutionStrategy { force 'androidx.core:core:1.6.0' }
        }
        targetSdkVersion 35
        versionCode 30203
        versionName project.libraryVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField 'String', 'SIP_DOMAIN', '"phone.plivo.com"'
        buildConfigField 'String', 'OUTBOUND_PROXY', '"client.plivo.com"'
        buildConfigField 'String', 'FALLBACK_PROXY', '"client-fb.plivo.com"'
        buildConfigField 'String', 'VERSION', '"'+project.libraryVersion+'"'
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            testCoverageEnabled true
        }
    }
    buildFeatures {
        buildConfig true
    }
    // Modern packaging for 16 KB page size support
    packagingOptions {
        resources {
            excludes += ['META-INF/proguard/androidx-annotations.pro']
        }
        jniLibs {
            useLegacyPackaging = false  // Modern packaging for 16 KB alignment
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    flavorDimensions "mode"
    productFlavors {
        prod {
            dimension "mode"
            buildConfigField 'String', 'SIP_DOMAIN', '"phone.plivo.com"'
        }
    }
    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
            // 16 KB page size alignment flags are set in Application.mk
            // APP_LDFLAGS is already configured there for 16 KB support
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

